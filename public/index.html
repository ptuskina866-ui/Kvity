<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Квиты — совместные расходы и деление чеков</title>

  <!-- PWA и мета-теги Apple iOS -->
  <meta name="description" content="Сервис совместных расходов и деления чеков без регистрации (Zero-login)">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Квиты">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', 'SF Pro Display', 'SF Pro Text', 'Inter', 'sans-serif'],
          },
          colors: {
            ios: {
              bg: '#f6f8fa',
              card: '#ffffff',
              subtle: '#f1f4f8',
              dark: '#0f172a',
              muted: '#64748b',
              border: 'rgba(0, 0, 0, 0.06)'
            }
          }
        }
      }
    }
  </script>

  <!-- Стили Apple UI -->
  <link rel="stylesheet" href="css/app.css">
</head>

<body
  class="bg-[#f6f8fa] text-slate-900 antialiased min-h-screen flex flex-col justify-between selection:bg-slate-900 selection:text-white">

  <!-- Toast-уведомления (iOS стиль с легкой тенью и размытием) -->
  <div id="toast-container"
    class="fixed top-5 left-1/2 -translate-x-1/2 z-50 flex flex-col gap-2 pointer-events-none w-11/12 max-w-sm"></div>

  <!-- Главная страница (Создание сбора) -->
  <main id="view-home" class="flex-1"></main>

  <!-- Страница комнаты (Сбор) -->
  <main id="view-room" class="flex-1 hidden pb-36">
    <!-- Индикатор загрузки -->
    <div id="room-loading" class="flex flex-col items-center justify-center min-h-[60vh] space-y-4">
      <div class="w-9 h-9 border-3 border-slate-200 border-t-slate-900 rounded-full animate-spin"></div>
      <p class="text-xs text-slate-500 font-medium tracking-wide">Загрузка сбора...</p>
    </div>

    <!-- Контент комнаты -->
    <div id="room-content" class="hidden max-w-md mx-auto p-4 space-y-4">
      <!-- Навигационная панель iOS -->
      <header class="flex items-center justify-between pt-2 pb-1 px-1">
        <a href="#"
          class="w-10 h-10 rounded-full bg-white border border-slate-200/80 shadow-sm flex items-center justify-center text-slate-700 hover:text-slate-900 btn-press transition"
          title="На главную">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M15 19l-7-7 7-7" />
          </svg>
        </a>

        <div class="text-center flex-1 px-2 min-w-0">
          <h1 id="room-title" class="text-base font-bold text-slate-900 truncate">Название сбора</h1>
          <button id="btn-open-participants"
            class="inline-flex items-center gap-1.5 text-xs text-slate-500 hover:text-slate-800 transition">
            <span id="room-participants-count">0 участников</span>
            <span class="w-1 h-1 rounded-full bg-slate-300"></span>
            <span class="text-[11px] text-indigo-600 font-medium">Реквизиты</span>
          </button>
        </div>

        <button id="btn-share-room"
          class="w-10 h-10 rounded-full bg-white border border-slate-200/80 shadow-sm flex items-center justify-center text-slate-700 hover:text-slate-900 btn-press transition"
          title="Поделиться ссылкой">
          <svg class="w-4.5 h-4.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z" />
          </svg>
        </button>
      </header>

      <!-- Карточка баланса в стиле Apple Wallet (как на референсе) -->
      <section class="apple-card rounded-[28px] p-6 space-y-4">
        <div class="flex items-center justify-between">
          <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Общие расходы</span>
          <span id="room-currency-badge"
            class="px-2.5 py-0.5 rounded-full bg-slate-100 text-slate-700 text-xs font-bold tracking-tight">RUB</span>
        </div>

        <div>
          <div id="summary-total-spent" class="text-4xl font-black text-slate-900 tracking-tight">0 ₽</div>
          <div class="flex items-center gap-2 mt-2 text-xs text-slate-500 font-medium">
            <span>В среднем:</span>
            <span id="summary-avg-spent" class="font-bold text-slate-800">0 ₽</span>
            <span class="text-slate-300">•</span>
            <span id="summary-expense-count">0 трат</span>
          </div>
        </div>

        <!-- Переключатель вкладок (iOS Segmented Control) -->
        <div class="ios-segment-bg p-1 rounded-2xl flex gap-1">
          <button id="tab-btn-expenses" class="flex-1 py-2 text-xs font-bold rounded-xl ios-segment-active transition">
            Расходы
          </button>
          <button id="tab-btn-balances"
            class="flex-1 py-2 text-xs font-bold rounded-xl text-slate-500 hover:text-slate-800 transition">
            Баланс и итоги
          </button>
        </div>
      </section>

      <!-- Вкладка 1: Список расходов -->
      <section id="tab-expenses-content" class="space-y-3">
        <div class="flex items-center justify-between px-1">
          <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400">История расходов</h2>
        </div>
        <div id="expenses-list-container" class="space-y-2.5"></div>
      </section>

      <!-- Вкладка 2: Балансы и взаиморасчеты -->
      <section id="tab-balances-content" class="space-y-4 hidden">
        <!-- Блок переводов (Кто кому) -->
        <div class="space-y-2.5">
          <div class="flex items-center justify-between px-1">
            <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400">Кто кому переводит</h2>
            <span
              class="text-[11px] font-semibold text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-full border border-emerald-100">Минимум
              транзакций</span>
          </div>
          <div id="settlement-transactions-container" class="space-y-2.5"></div>
        </div>

        <!-- Кнопка формирования отчета для чата (iOS Dark Apple Button) -->
        <button id="btn-generate-chat-report"
          class="w-full py-3.5 px-4 bg-slate-900 hover:bg-slate-800 text-white font-semibold rounded-2xl shadow-sm btn-press transition flex items-center justify-center gap-2 text-xs tracking-tight">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" />
          </svg>
          <span>Сформировать отчет для чата Telegram</span>
        </button>

        <!-- Чистые балансы участников -->
        <div class="space-y-2 pt-2">
          <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400 px-1">Баланс участников</h2>
          <div id="net-balances-container" class="space-y-2"></div>
        </div>
      </section>
    </div>

    <!-- Плавающая нижняя панель (Apple Floating Pill Dock) -->
    <nav class="fixed bottom-6 left-0 right-0 px-4 max-w-md mx-auto z-30 pointer-events-none flex justify-center">
      <button id="btn-open-add-expense"
        class="pointer-events-auto px-6 py-3.5 bg-slate-900 hover:bg-slate-800 text-white font-bold rounded-full shadow-xl shadow-slate-900/20 btn-press transition flex items-center gap-2.5 text-sm">
        <span class="text-lg leading-none font-light">+</span>
        <span>Добавить расход</span>
      </button>
    </nav>
  </main>

  <!-- Модальное окно: Добавить расход (Apple Bottom Sheet) -->
  <div id="modal-add-expense"
    class="app-modal fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 hidden modal-backdrop bg-slate-900/40 backdrop-blur-md">
    <div
      class="apple-card bg-white border-t sm:border border-slate-100 rounded-t-[32px] sm:rounded-[32px] w-full max-w-md p-6 space-y-5 animate-apple-sheet max-h-[90vh] overflow-y-auto">
      <div class="sheet-drag-handle"></div>

      <div class="flex items-center justify-between pb-1">
        <h3 class="text-lg font-bold text-slate-900">Новый расход</h3>
        <button
          class="btn-close-modal w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 hover:text-slate-800 text-base font-bold transition">&times;</button>
      </div>

      <div class="space-y-4">
        <!-- Поле суммы крупно (как в Apple Pay / Переводах) -->
        <div class="p-4 bg-slate-50 rounded-2xl border border-slate-100 text-center">
          <label class="block text-xs font-medium text-slate-400 mb-1">Сумма расхода</label>
          <input type="number" step="0.01" min="0" id="expense-amount" placeholder="0"
            class="w-full bg-transparent text-center text-4xl font-black text-slate-900 placeholder-slate-300 focus:outline-none transition tracking-tight">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1.5">На что потрачено?</label>
          <input type="text" id="expense-title" placeholder="например: Шашлыки, Такси, Отель"
            class="w-full bg-slate-50 border border-slate-200/80 rounded-2xl px-4 py-3 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:border-slate-900 transition">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1.5">Кто оплатил?</label>
          <div class="relative">
            <select id="expense-payer-select"
              class="w-full bg-slate-50 border border-slate-200/80 rounded-2xl px-4 py-3 text-sm font-medium text-slate-900 focus:outline-none focus:border-slate-900 transition appearance-none"></select>
            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-400">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
              </svg>
            </div>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1.5">На кого делить?</label>
          <div id="expense-splits-container" class="bg-slate-50 rounded-2xl p-3.5 border border-slate-200/80"></div>
        </div>
      </div>

      <div class="pt-2">
        <button id="btn-save-expense"
          class="w-full py-4 px-4 bg-slate-900 hover:bg-slate-800 text-white font-bold rounded-2xl shadow-sm btn-press transition text-sm">
          Сохранить расход
        </button>
      </div>
    </div>
  </div>

  <!-- Модальное окно: Участники и реквизиты (Apple Bottom Sheet) -->
  <div id="modal-participants"
    class="app-modal fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 hidden modal-backdrop bg-slate-900/40 backdrop-blur-md">
    <div
      class="apple-card bg-white border-t sm:border border-slate-100 rounded-t-[32px] sm:rounded-[32px] w-full max-w-md p-6 space-y-5 animate-apple-sheet max-h-[90vh] overflow-y-auto">
      <div class="sheet-drag-handle"></div>

      <div class="flex items-center justify-between pb-1">
        <div>
          <h3 class="text-lg font-bold text-slate-900">Участники и реквизиты</h3>
          <p class="text-xs text-slate-400 mt-0.5">Укажите карту или телефон для СБП / ЕРИП</p>
        </div>
        <button
          class="btn-close-modal w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 hover:text-slate-800 text-base font-bold transition">&times;</button>
      </div>

      <div id="participants-manage-container" class="space-y-4"></div>
    </div>
  </div>

  <!-- Главный скрипт логики -->
  <script type="module" src="js/app.js"></script>
</body>

</html>
